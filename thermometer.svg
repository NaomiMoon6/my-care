<svg viewBox="0 0 200 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif;">
  
  <defs>
    <!-- Gradiente do Fluido (Mude as cores aqui se quiser outro tom) -->
    <linearGradient id="fluidGrad-light" x1="0" y1="95" x2="0" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B30" /> <!-- Vermelho (Febre Alta) -->
      <stop offset="45%" stop-color="#FF9500" /> <!-- Laranja (Atenção) -->
      <stop offset="100%" stop-color="#34C759" /> <!-- Verde (Normal) / Pode trocar para #32ADE6 (Azul) -->
    </linearGradient>

    <!-- Sombra externa suave para o tema claro -->
    <filter id="cardShadow-light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#94A3B8" flood-opacity="0.15" />
    </filter>
    
    <!-- Brilho do bulbo mais sutil -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sombra interna para dar profundidade ao vidro no tema claro -->
    <filter id="insetShadow-light">
      <feOffset dx="0" dy="2" />
      <feGaussianBlur stdDeviation="3" result="offset-blur" />
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse" />
      <feFlood flood-color="#94A3B8" flood-opacity="0.3" result="color" />
      <feComposite operator="in" in="color" in2="inverse" result="shadow" />
      <feComposite operator="over" in="shadow" in2="SourceGraphic" />
    </filter>
  </defs>

  <!-- Anéis Decorativos Externos (Cinza bem claro) -->
  <circle cx="100" cy="320" r="48" stroke="#E2E8F0" stroke-width="2" fill="none" />
  <circle cx="100" cy="320" r="58" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 6" fill="none" />

  <!-- Corpo do Termômetro (Vidro/Plástico Branco) -->
  <g filter="url(#cardShadow-light)">
    <rect x="78" y="75" width="44" height="240" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="100" cy="320" r="35" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="80" y="280" width="40" height="20" fill="#FFFFFF" /> <!-- Remove a linha de sobreposição -->
  </g>

  <!-- Canaleta Interna (Fundo vazio do termômetro) -->
  <g filter="url(#insetShadow-light)">
    <rect x="86" y="83" width="28" height="240" rx="14" fill="#F8FAFC" />
    <circle cx="100" cy="320" r="27" fill="#F8FAFC" />
  </g>

  <!-- ========================================== -->
  <!-- 🔻 ÁREA CUSTOMIZÁVEL: NÍVEL DA TEMPERATURA 🔻 -->
  <!-- ========================================== -->
  
  <!-- 
    GUIA DE MEDIDAS (Eixo Y e Altura):
    40°C -> y="95"  | height="205"
    39°C -> y="135" | height="165"
    38°C -> y="175" | height="125"
    37°C -> y="215" | height="85"  (Atual)
    36°C -> y="255" | height="45" 
  -->
  <!--rect x="90" y="215" width="20" height="85" rx="10" fill="url(#fluidGrad-light)" /-->
  
  <!-- ========================================== -->

  <!-- Bulbo de Fluido (Fixo) -->
  <circle cx="100" cy="320" r="23" fill="url(#fluidGrad-light)" filter="url(#glow-light)" opacity="0.9" />

  <!-- Brilho do Vidro (Reflexo 3D sutil) -->
  <rect x="92" y="88" width="6" height="200" rx="3" fill="#FFFFFF" opacity="0.6" />
  <circle cx="94" cy="310" r="6" fill="#FFFFFF" opacity="0.7" />

  <!-- Marcações da Escala (Tracos cinzas) -->
  <g stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
    <line x1="65" y1="95" x2="73" y2="95" />  <!-- 40° -->
    <line x1="69" y1="115" x2="73" y2="115" stroke-width="1" stroke="#CBD5E1" />
    <line x1="65" y1="135" x2="73" y2="135" /> <!-- 39° -->
    <line x1="69" y1="155" x2="73" y2="155" stroke-width="1" stroke="#CBD5E1" />
    <line x1="65" y1="175" x2="73" y2="175" /> <!-- 38° -->
    <line x1="69" y1="195" x2="73" y2="195" stroke-width="1" stroke="#CBD5E1" />
    <line x1="65" y1="215" x2="73" y2="215" /> <!-- 37° -->
    <line x1="69" y1="235" x2="73" y2="235" stroke-width="1" stroke="#CBD5E1" />
    <line x1="65" y1="255" x2="73" y2="255" /> <!-- 36° -->
    <line x1="69" y1="275" x2="73" y2="275" stroke-width="1" stroke="#CBD5E1" />
  </g>

  <!-- Textos da Escala -->
  <g fill="#64748B" font-size="10" font-weight="600" text-anchor="end" alignment-baseline="middle">
    <text x="55" y="96">40</text>
    <text x="55" y="136">39</text>
    <text x="55" y="176">38</text>
    <text x="55" y="216">37</text>
    <text x="55" y="256">36</text>
  </g>

</svg>