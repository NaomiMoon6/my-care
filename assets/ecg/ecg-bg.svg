<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <!-- 1mm Small Grid Pattern (5px x 5px) -->
    <pattern id="small-grid" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M 5 0 L 0 0 0 5" fill="none" stroke="#D16D6A" stroke-width="0.3" stroke-opacity="0.25" />
    </pattern>

    <!-- 5mm Large Grid Pattern (25px x 25px) -->
    <pattern id="large-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="url(#small-grid)" />
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#D16D6A" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <!-- Subtle Vignette / Shading Layer for Depth -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F9F1F0" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- ECG Grid Fill -->
  <rect width="400" height="150" fill="url(#large-grid)" />

  <!-- Crisp Outer Border -->
  <rect width="400" height="150" fill="none" stroke="#D16D6A" stroke-width="1" stroke-opacity="0.4" />
</svg>
